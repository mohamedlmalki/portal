<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exclusive Digital Access Portal</title>
  <style>
    :root {
      --bg-deep: #071924;
      --bg-teal: #0c3642;
      --accent-yellow: #fae042;
      --accent-cyan: #22d3ee;
      --text-white: #ffffff;
      --text-muted: #94a3b8;
      --card-glass: rgba(10, 32, 44, 0.72);
      --border-glass: rgba(34, 211, 238, 0.22);
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background: radial-gradient(circle at 80% 20%, rgba(34, 211, 238, 0.16) 0%, transparent 45%),
                  radial-gradient(circle at 15% 85%, rgba(250, 224, 66, 0.1) 0%, transparent 40%),
                  linear-gradient(135deg, var(--bg-deep) 0%, var(--bg-teal) 50%, #05141c 100%);
      color: var(--text-white);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px 14px;
    }
    .container {
      width: 100%;
      max-width: 900px;
      background: var(--card-glass);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border-glass);
      border-radius: 28px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.45), 0 0 40px rgba(34, 211, 238, 0.08);
      overflow: hidden;
      padding: 30px;
    }
    .nav-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 28px;
    }
    .logo-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(34, 211, 238, 0.1);
      border: 1px solid rgba(34, 211, 238, 0.3);
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      color: var(--accent-cyan);
      letter-spacing: 0.5px;
    }
    .status-pill {
      font-size: 12px;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.4);
      color: #34d399;
      padding: 6px 14px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
    }
    .status-dot {
      width: 6px;
      height: 6px;
      background: #10b981;
      border-radius: 50%;
      box-shadow: 0 0 8px #10b981;
    }
    .main-grid {
      display: grid;
      grid-template-columns: 1.2fr 1fr 0.6fr;
      gap: 28px;
      align-items: center;
    }
    .hero-title {
      font-size: 32px;
      line-height: 1.2;
      font-weight: 800;
      color: var(--accent-yellow);
      margin-bottom: 14px;
      letter-spacing: -0.5px;
    }
    .hero-desc {
      font-size: 15px;
      line-height: 1.6;
      color: var(--text-muted);
      margin-bottom: 24px;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .btn-primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: linear-gradient(135deg, #0f2736 0%, #154350 100%);
      border: 1.5px solid var(--accent-cyan);
      color: #ffffff;
      padding: 16px 26px;
      border-radius: 999px;
      text-decoration: none;
      font-size: 15px;
      font-weight: 700;
      box-shadow: 0 0 20px rgba(34, 211, 238, 0.25);
      transition: all 0.2s ease;
    }
    .btn-primary:hover {
      background: var(--accent-cyan);
      color: var(--bg-deep);
      box-shadow: 0 0 30px rgba(34, 211, 238, 0.5);
      transform: translateY(-2px);
    }
    .social-proof {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 14px;
      font-size: 12px;
      color: var(--text-muted);
    }
    .avatar-stack {
      display: flex;
    }
    .avatar-stack span {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--accent-cyan);
      border: 2px solid var(--bg-deep);
      margin-left: -6px;
      display: inline-block;
    }
    .avatar-stack span:nth-child(1) { background: #38bdf8; margin-left: 0; }
    .avatar-stack span:nth-child(2) { background: #fae042; }
    .avatar-stack span:nth-child(3) { background: #34d399; }
    .portal-arch-wrap {
      position: relative;
      display: flex;
      justify-content: center;
    }
    .portal-arch {
      width: 100%;
      max-width: 270px;
      height: 360px;
      border-radius: 135px 135px 30px 30px;
      border: 2px solid rgba(34, 211, 238, 0.4);
      box-shadow: 0 0 35px rgba(34, 211, 238, 0.2);
      overflow: hidden;
      background: #08212c;
    }
    .portal-arch img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .stats-col {
      display: flex;
      flex-direction: column;
      gap: 20px;
      padding-left: 10px;
      border-left: 1px solid rgba(255, 255, 255, 0.08);
    }
    .stat-item span {
      font-size: 11px;
      text-transform: uppercase;
      font-weight: 700;
      color: var(--accent-cyan);
      letter-spacing: 0.8px;
      display: block;
      margin-bottom: 2px;
    }
    .stat-item strong {
      font-size: 26px;
      font-weight: 800;
      color: #ffffff;
      line-height: 1.1;
    }
    @media (max-width: 768px) {
      .container { padding: 22px 18px; border-radius: 20px; }
      .main-grid { grid-template-columns: 1fr; gap: 24px; text-align: center; }
      .portal-arch-wrap { order: -1; }
      .portal-arch { max-width: 220px; height: 290px; margin: 0 auto; }
      .hero-title { font-size: 24px; }
      .stats-col {
        flex-direction: row;
        justify-content: space-around;
        border-left: none;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
        padding-top: 18px;
        padding-left: 0;
      }
      .stat-item strong { font-size: 20px; }
      .social-proof { justify-content: center; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="nav-bar">
      <div class="logo-badge">PORTAL // DIRECT</div>
      <div class="status-pill"><span class="status-dot"></span> Server Active</div>
    </div>
    <div class="main-grid">
      <div class="text-content">
        <h1 class="hero-title">Exclusive Digital Access Portal</h1>
        <p class="hero-desc">Access verified direct download files and unlock your package instantly.</p>
        <div class="btn-group">
          <a href="https://offertrk.org/cl/i/l7v9vd" class="btn-primary">Unlock & Access File &rarr;</a>
        </div>
        <div class="social-proof">
          <div class="avatar-stack">
            <span></span><span></span><span></span>
          </div>
          <span>3,420+ successful unlocks today</span>
        </div>
      </div>
      <div class="portal-arch-wrap">
        <div class="portal-arch">
          <img src="https://image.pollinations.ai/prompt/modern%20digital%20vault%20cyber%20aesthetic%203d%20render?width=1000&height=1500&nologo=true&seed=38474" alt="File Preview">
        </div>
      </div>
      <div class="stats-col">
        <div class="stat-item">
          <span>Unlocks</span>
          <strong>24.8K</strong>
        </div>
        <div class="stat-item">
          <span>Verified</span>
          <strong>100%</strong>
        </div>
        <div class="stat-item">
          <span>Speed</span>
          <strong>Instant</strong>
        </div>
      </div>
    </div>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Direct Digital Package Access</title>
  <style>
    :root {
      --bg: #090a0f;
      --card-bg: #11141c;
      --border: #1e2433;
      --border-light: #2b3347;
      --accent: #10b981;
      --accent-glow: rgba(16, 185, 129, 0.25);
      --text: #f1f5f9;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background: radial-gradient(circle at 50% 0%, #151b29 0%, var(--bg) 70%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .wrapper {
      max-width: 440px;
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
      overflow: hidden;
    }
    .top-status {
      padding: 12px 18px;
      background: rgba(255,255,255,0.02);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: var(--text-muted);
    }
    .badge-live {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--accent);
    }
    .ping {
      width: 6px;
      height: 6px;
      background: var(--accent);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--accent);
    }
    .img-box {
      width: 100%;
      height: 220px;
      position: relative;
      background: #000;
    }
    .img-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.9;
    }
    .card-body {
      padding: 22px 20px 24px 20px;
    }
    h1 {
      font-size: 19px;
      font-weight: 700;
      line-height: 1.3;
      margin-bottom: 8px;
      color: #ffffff;
    }
    p.desc {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 18px;
    }
    .file-meta {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 20px;
      text-align: center;
    }
    .meta-cell:not(:last-child) {
      border-right: 1px solid var(--border);
    }
    .meta-label {
      font-size: 10px;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 2px;
    }
    .meta-val {
      font-size: 12px;
      font-weight: 700;
      color: #fff;
    }
    .meta-val.green { color: var(--accent); }
    .btn-unlock {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      background: var(--accent);
      color: #06281e;
      text-decoration: none;
      padding: 15px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: -0.2px;
      box-shadow: 0 4px 20px var(--accent-glow);
      transition: all 0.2s ease;
    }
    .btn-unlock:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 25px rgba(16, 185, 129, 0.4);
      background: #34d399;
    }
    .guarantee {
      margin-top: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 11px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="top-status">
      <span>File Gateway v4.2</span>
      <div class="badge-live"><span class="ping"></span> Server Online</div>
    </div>
    
    <div class="img-box">
      <img src="https://image.pollinations.ai/prompt/sleek%20modern%20tech%20file%20vault%203d%20render%20dark%20background?width=1000&height=1000&nologo=true&seed=5817" alt="Verified Resource Preview">
    </div>

    <div class="card-body">
      <h1>Direct Digital Package Access</h1>
      <p class="desc">Verified package ready for immediate download. Encrypted file delivery.</p>

      <div class="file-meta">
        <div class="meta-cell">
          <div class="meta-label">Format</div>
          <div class="meta-val">Direct File</div>
        </div>
        <div class="meta-cell">
          <div class="meta-label">Security</div>
          <div class="meta-val green">✓ Verified</div>
        </div>
        <div class="meta-cell">
          <div class="meta-label">Delivery</div>
          <div class="meta-val">Instant</div>
        </div>
      </div>

      <a href="https://offertrk.org/cl/i/l7v9vd" class="btn-unlock">
        <span>Download & Unlock File</span>
        <span>&rarr;</span>
      </a>

      <div class="guarantee">
        🔒 256-Bit Encrypted Transfer • Clean Download
      </div>
    </div>
  </div>
</body>
</html>
